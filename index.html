<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Lab Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
    <div class="nav-container">
        <span class="logo">LANGUAGE LAB</span>
        <div class="nav-menu">
            <button class="nav-link active" onclick="showSection('dash-sec')">홈</button>
            <button class="nav-link" onclick="showSection('voca-sec')">단어장</button>
            <button class="nav-link" onclick="showSection('archive-sec')">자료실</button>
            <button class="nav-link" onclick="showSection('quiz-sec')">퀴즈</button>
        </div>
        <div class="nav-right">
            <select id="langSelect" onchange="switchLanguage(this.value)">
                <option value="en">English</option>
                <option value="jp">日本語</option>
                <option value="cn">中文</option>
            </select>
        </div>
    </div>
</nav>

<div class="main-container">
    <section id="dash-sec" class="content-section active">
        <div class="card">
            <h2>📊 <span id="display-lang">EN</span> 학습 통계</h2>
            <div class="progress-container">
                <div class="progress-text">전체 달성률: <span id="progress-pct">0%</span></div>
                <div class="progress-bar-bg">
                    <div id="progress-fill" class="progress-bar-fill"></div>
                </div>
            </div>
            <div class="stats-row">
                <div class="stat-box"><span>단어 수</span><strong id="total-words">0</strong></div>
                <div class="stat-box"><span>학습 완료</span><strong id="done-words">0</strong></div>
            </div>
            <div class="goal-area">
                <label>🏁 나의 목표:</label>
                <input type="text" id="goalInput" placeholder="목표를 입력하세요." onchange="saveGoal()">
            </div>
        </div>
        
        <div class="card">
            <h2>🏆 시험 정보</h2>
            <div id="examTabs" class="tabs"></div>
            <div id="examDetail" class="detail-box">언어를 선택하세요.</div>
        </div>
    </section>

    <section id="voca-sec" class="content-section">
        <div class="card">
            <h2>📓 단어장 관리</h2>
            <div class="input-row">
                <input type="text" id="wordIn" placeholder="단어">
                <input type="text" id="meanIn" placeholder="뜻">
                <select id="vocaCat">
                    <option value="명사">명사</option>
                    <option value="동사">동사</option>
                    <option value="형용사">형용사</option>
                    <option value="기타">기타</option>
                </select>
                <button class="btn-add" onclick="addWord()">추가</button>
            </div>
            <div class="filter-row">
                <button onclick="renderWords('전체')">전체</button>
                <button onclick="renderWords('명사')">명사</button>
                <button onclick="renderWords('동사')">동사</button>
                <button onclick="renderWords('미완료')">미완료만</button>
            </div>
            <div class="table-wrapper">
                <table class="data-table">
                    <thead>
                        <tr><th>학습</th><th>단어(분류)</th><th>뜻</th><th>삭제</th></tr>
                    </thead>
                    <tbody id="wordList"></tbody>
                </table>
            </div>
        </div>
    </section>

    <section id="archive-sec" class="content-section">
        <div class="card">
            <h2>📚 자료실 (PDF 및 링크)</h2>
            <div class="input-row">
                <select id="archiveType">
                    <option value="grammar">문법</option>
                    <option value="exp">회화</option>
                    <option value="exam">시험자료</option>
                </select>
                <input type="text" id="archiveTitle" placeholder="제목">
                <input type="text" id="archiveContent" placeholder="내용 또는 파일 경로(PDF 등)">
                <button class="btn-add" onclick="addArchive()">저장</button>
            </div>
            <div id="archiveDisplay" class="archive-grid"></div>
        </div>
    </section>

    <section id="quiz-sec" class="content-section">
        <div class="card quiz-card">
            <h2>🧠 단어 퀴즈</h2>
            <div id="quiz-area">
                <button class="btn-add" onclick="startQuiz()">퀴즈 시작하기</button>
            </div>
        </div>
    </section>
</div>

<script src="script.js"></script>
</body>
</html>
