<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Lab - My Study Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
    <div class="nav-container">
        <span class="logo">LANGUAGE LAB</span>
        <div class="nav-right">
            <select id="langSelect" onchange="switchLanguage(this.value)">
                <option value="en">English (영어)</option>
                <option value="jp">日本語 (일본어)</option>
                <option value="cn">中文 (중국어)</option>
            </select>
            <button class="btn-export" onclick="exportData()">데이터 내보내기 (JSON)</button>
        </div>
    </div>
</nav>

<div class="main-container">
    <section class="card dashboard">
        <div class="section-header">
            <h2>📊 <span id="display-lang">EN</span> 대시보드</h2>
        </div>
        <div class="stats-row">
            <div class="stat-box"><span>전체 단어</span><strong id="total-words">0</strong></div>
            <div class="stat-box"><span>학습 완료</span><strong id="done-words">0</strong></div>
            <div class="stat-box"><span>진척도</span><strong id="progress-pct">0%</strong></div>
        </div>
        <div class="goal-area">
            <label>🏁 목표:</label>
            <input type="text" id="goalInput" placeholder="이번 달 목표를 입력하세요." onchange="saveGoal()">
        </div>
    </section>

    <section class="card">
        <h2>📓 단어장</h2>
        <div class="input-row">
            <input type="text" id="wordIn" placeholder="단어">
            <input type="text" id="meanIn" placeholder="뜻">
            <input type="text" id="exIn" placeholder="예문">
            <button class="btn-add" onclick="addWord()">추가</button>
        </div>
        <div class="table-wrapper">
            <table class="data-table">
                <thead>
                    <tr>
                        <th width="50">학습</th>
                        <th>단어</th>
                        <th>뜻 및 예문</th>
                        <th width="60">삭제</th>
                    </tr>
                </thead>
                <tbody id="wordList"></tbody>
            </table>
        </div>
    </section>

    <section class="card">
        <h2>📚 자료 정리 (문법/회화)</h2>
        <div class="input-row">
            <select id="archiveType">
                <option value="grammar">문법</option>
                <option value="exp">회화/표현</option>
                <option value="ref">기타참고</option>
            </select>
            <input type="text" id="archiveTitle" placeholder="제목">
            <input type="text" id="archiveContent" placeholder="내용 또는 링크">
            <button class="btn-add" onclick="addArchive()">저장</button>
        </div>
        <div id="archiveDisplay" class="archive-grid"></div>
    </section>

    <section class="card">
        <h2>🏆 시험 정보</h2>
        <div id="examTabs" class="tabs"></div>
        <div id="examDetail" class="detail-box">언어를 선택하면 시험 정보가 나타납니다.</div>
    </section>
</div>

<script src="script.js"></script>
</body>
</html>
